name: PR 14 macOS Acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    if: github.head_ref == 'agent/fix-benchmark-manifest-v1.5.0'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare executable permissions
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          chmod +x *.sh scripts/*.sh
      - name: Build Go backend
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          ./scripts/build_macos.sh 2>&1 | tee /tmp/macpowerlab-build.log
      - name: Run project tests
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          ./scripts/run_tests.sh 2>&1 | tee /tmp/macpowerlab-tests.log
      - name: Build native benchmark workloads
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          ./scripts/build_native.sh 2>&1 | tee /tmp/macpowerlab-native-build.log
      - name: Build and sign SwiftUI app bundle
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          ./scripts/build_swiftui_app.sh 2>&1 | tee /tmp/macpowerlab-app-build.log
      - name: Verify versioned app bundle
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          ./bin/macpowerlab version | tee /tmp/macpowerlab-version.txt
          grep -F 'MacPowerLab v1.5.0' /tmp/macpowerlab-version.txt
          test "$(plutil -extract CFBundleShortVersionString raw dist/MacPowerLab.app/Contents/Info.plist)" = '1.5.0'
          test "$(plutil -extract CFBundleVersion raw dist/MacPowerLab.app/Contents/Info.plist)" = '150'
          codesign --verify --deep --strict --verbose=2 dist/MacPowerLab.app
      - name: Run native workloads
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          ./bin/native/cpu_stress 2 2>&1 | tee /tmp/macpowerlab-cpu-workload.log
          ./bin/native/memory_stress 2 64 2>&1 | tee /tmp/macpowerlab-memory-workload.log
      - name: Run focused benchmark lifecycle regressions
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          go test -count=1 ./internal/benchmark \
            -run 'TestPhaseCompletionGraceScalesAndStaysBounded|TestRunPhaseAcceptsSuccessfulExitAfterDeadline|TestRunPhasePreservesParentCancellationAfterSuccessfulCleanup|TestShouldRecordWorkloadWaitUsesExitSnapshot|TestRunCommandsPreservesDeadlineForGracefulExit|TestFinalizeWorkloadResultDistinguishesDeadlineOrder' \
            2>&1 | tee /tmp/macpowerlab-benchmark-regressions.log
      - name: Create support bundle and inspect manifest
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          export DATA_DIR="$RUNNER_TEMP/macpowerlab-support-root"
          export ARCHIVE="$RUNNER_TEMP/MacPowerLab_Support.tar.gz"
          mkdir -p "$DATA_DIR/sessions/sample"
          print -r -- 'sample diagnostic' > "$DATA_DIR/sessions/sample/diagnostic.txt"
          print -r -- 'must not be packaged' > "$DATA_DIR/api.token"
          STARTED_AT="$(date -u +%s)"
          export STARTED_AT
          ./bin/macpowerlab support pack \
            --data-dir "$DATA_DIR" \
            --output "$ARCHIVE" \
            2>&1 | tee /tmp/macpowerlab-support-pack.log
          python3 - <<'PY' 2>&1 | tee /tmp/macpowerlab-archive-check.log
          import datetime as dt
          import json
          import os
          import struct
          import tarfile
          from pathlib import Path

          archive = Path(os.environ['ARCHIVE'])
          raw = archive.read_bytes()
          if len(raw) < 10 or raw[:2] != b'\x1f\x8b':
              raise SystemExit('support archive is not gzip')
          if struct.unpack('<I', raw[4:8])[0] != 0:
              raise SystemExit('gzip header timestamp is not normalized')

          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit('support archive contains no members')
              nonzero = [member.name for member in members if member.mtime != 0]
              if nonzero:
                  raise SystemExit(f'tar timestamps are not normalized: {nonzero!r}')
              manifest_member = bundle.getmember('MANIFEST_macpowerlab.json')
              manifest = json.load(bundle.extractfile(manifest_member))
              packaged_names = {member.name for member in members}

          created = dt.datetime.fromisoformat(manifest['created_at'].replace('Z', '+00:00')).timestamp()
          started = int(os.environ['STARTED_AT'])
          now = dt.datetime.now(dt.timezone.utc).timestamp()
          if created < started or created > now + 5:
              raise SystemExit(f"manifest created_at={manifest['created_at']} outside [{started}, {now}]")
          excluded = {entry['path']: entry['reason'] for entry in manifest.get('excluded', [])}
          if excluded.get('api.token') != 'local API credential':
              raise SystemExit(f'credential exclusion missing or wrong: {excluded!r}')
          if any(name.endswith('/api.token') or name == 'api.token' for name in packaged_names):
              raise SystemExit('api.token was packaged')
          print(f'Validated support archive {archive}')
          print(f"Manifest created_at={manifest['created_at']}")
          PY
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr14-macos-acceptance-logs
          path: |
            /tmp/macpowerlab-*.log
            /tmp/macpowerlab-version.txt
          if-no-files-found: warn
