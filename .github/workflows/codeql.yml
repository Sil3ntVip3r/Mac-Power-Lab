name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: write
  security-events: write

jobs:
  prepare-legacy-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/legacy-once-logging' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-once-logging
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify focused starting state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected='.github/workflows/ci.yml
.github/workflows/codeql.yml
.github/workflows/prepare-legacy-once-pr.yml
CHANGELOG.md
legacy/tests/test_once_logging.py
scripts/_prepare_legacy_once.py'
          actual="$(git diff --name-only origin/main...HEAD)"
          test "$actual" = "$expected"
          git diff --exit-code origin/main -- legacy/mac_power_watch_v0.12.0.py
      - name: Apply focused source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_prepare_legacy_once.py
          git diff --check
          git diff --exit-code origin/main -- legacy/mac_power_watch_v0.12.0.py
      - name: Validate legacy and Go code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q legacy
          python3 -m unittest discover -s legacy/tests -v
          python3 legacy/mac_power_watch.py --help >/dev/null
          (cd legacy && sha256sum -c MANIFEST_SHA256.txt)
          test -z "$(gofmt -l cmd internal)"
          go test -count=1 ./...
          go vet ./...
      - name: Commit validated source and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/codeql.yml > .github/workflows/codeql.yml
          git rm .github/workflows/prepare-legacy-once-pr.yml scripts/_prepare_legacy_once.py
          git add .github/workflows/ci.yml .github/workflows/codeql.yml CHANGELOG.md legacy/mac_power_watch.py legacy/MANIFEST_SHA256.txt legacy/tests/test_once_logging.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete legacy one-shot logging'
          git push origin HEAD:fix/legacy-once-logging

  analyze:
    if: github.event_name != 'pull_request' || github.head_ref != 'fix/legacy-once-logging' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
