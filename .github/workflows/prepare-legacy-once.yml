name: Prepare legacy one-shot fix

on:
  push:
    branches:
      - fix/legacy-once-logging

permissions:
  contents: write

concurrency:
  group: prepare-legacy-once
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-once-logging
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify focused starting state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/prepare-legacy-once.yml'
      - name: Apply focused implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('legacy/mac_power_watch.py')
          text = source.read_text()

          old = '''import subprocess
          import threading
          '''
          new = '''import subprocess
          import sys
          import threading
          '''
          if text.count(old) != 1:
              raise SystemExit('import insertion target was not unique')
          text = text.replace(old, new)

          old = '''def default_log_arg():
              return "auto"


          def print_raw_keys(phase_file):
          '''
          new = '''def default_log_arg():
              return "auto"


          def option_supplied(arguments, option):
              return any(argument == option or argument.startswith(option + "=") for argument in arguments)


          def collect_powermetrics_once(sample_ms=1000):
              worker = PowermetricsWorker(sample_ms=sample_ms)
              worker._run_once()
              return worker.snapshot()


          def print_raw_keys(phase_file):
          '''
          if text.count(old) != 1:
              raise SystemExit('one-shot helper insertion target was not unique')
          text = text.replace(old, new)

          old = '''def print_once(phase_file):
              row, _ = collect_reading(phase_file)
              print(f"{APP_NAME} v{VERSION}")
              print(f"Time: {row['display_time']}")
              print(f"Phase: {row['phase']}")
              print(f"Mode: {row['mode']}")
              print(f"Power source: {row['power_source']}")
              print(f"Battery: {fmt(row['battery_percent'], '%', 1)}")
              print(f"Temperature: {fmt(row['battery_temp_c'], ' °C', 1)} / {fmt(row['battery_temp_f'], ' °F', 1)}")
              print(f"Virtual temp: {fmt(row['virtual_temp_c'], ' °C', 1)}")
              print(f"Net battery watts: {fmt(row['net_battery_watts'], ' W', 2)}")
              print(f"Internal BMS power: {fmt(row.get('bms_system_power_w'), ' W', 2)}")
              print(f"Preferred system power: {fmt(row.get('preferred_system_power_w'), ' W', 2)}")
              print(f"Charger verdict: {safe_str(row.get('charger_live_verdict'))}")
              print(f"Mac use estimate: {fmt(row['whole_mac_watts_estimate'], ' W', 2)} ({row['whole_mac_watts_note']})")
              print(f"Voltage / amps: {fmt(row['battery_voltage_v'], ' V', 3)} / {fmt(row['battery_amperage_a'], ' A', 3)}")
              print(f"Adapter rated watts: {safe_str(row['adapter_reported_watts'])} W")
              print(f"Live health estimate: {fmt(row['battery_health_percent'], '%', 1)}")
          '''
          new = '''def print_once(phase_file, pm_snapshot=None):
              row, raw = collect_reading(phase_file, pm_snapshot)
              print(f"{APP_NAME} v{VERSION}")
              print(f"Time: {row['display_time']}")
              print(f"Phase: {row['phase']}")
              print(f"Mode: {row['mode']}")
              print(f"Power source: {row['power_source']}")
              print(f"Battery: {fmt(row['battery_percent'], '%', 1)}")
              print(f"Temperature: {fmt(row['battery_temp_c'], ' °C', 1)} / {fmt(row['battery_temp_f'], ' °F', 1)}")
              print(f"Virtual temp: {fmt(row['virtual_temp_c'], ' °C', 1)}")
              print(f"Net battery watts: {fmt(row['net_battery_watts'], ' W', 2)}")
              print(f"Internal BMS power: {fmt(row.get('bms_system_power_w'), ' W', 2)}")
              print(f"Preferred system power: {fmt(row.get('preferred_system_power_w'), ' W', 2)}")
              print(f"Charger verdict: {safe_str(row.get('charger_live_verdict'))}")
              print(f"Mac use estimate: {fmt(row['whole_mac_watts_estimate'], ' W', 2)} ({row['whole_mac_watts_note']})")
              print(f"Voltage / amps: {fmt(row['battery_voltage_v'], ' V', 3)} / {fmt(row['battery_amperage_a'], ' A', 3)}")
              print(f"Adapter rated watts: {safe_str(row['adapter_reported_watts'])} W")
              print(f"Live health estimate: {fmt(row['battery_health_percent'], '%', 1)}")
              return row, raw


          def run_once(args, log_requested=False):
              pm_snapshot = collect_powermetrics_once(args.powermetrics_sample_ms) if args.powermetrics else None
              row, raw = print_once(args.phase_file, pm_snapshot)
              if not log_requested or args.no_log:
                  return row

              logger = RunLogger(
                  args.log,
                  no_log=False,
                  debug_every=args.debug_every,
                  keep_raw_debug=not args.no_debug_json,
              )
              try:
                  logger.write_csv(row)
                  logger.maybe_write_debug(row, raw)
              finally:
                  logger.close()
              return row
          '''
          if text.count(old) != 1:
              raise SystemExit('print_once replacement target was not unique')
          text = text.replace(old, new)

          old = '''def main():
              parser = argparse.ArgumentParser(description=f"{APP_NAME} v{VERSION}")
          '''
          new = '''def main(argv=None):
              raw_args = list(sys.argv[1:] if argv is None else argv)
              parser = argparse.ArgumentParser(description=f"{APP_NAME} v{VERSION}")
          '''
          if text.count(old) != 1:
              raise SystemExit('main signature target was not unique')
          text = text.replace(old, new)

          old = '''    args = parser.parse_args()
          '''
          new = '''    args = parser.parse_args(raw_args)
          '''
          if text.count(old) != 1:
              raise SystemExit('argument parsing target was not unique')
          text = text.replace(old, new)

          old = '''    if args.once:
                  print_once(args.phase_file)
                  return
          '''
          new = '''    if args.once:
                  run_once(args, log_requested=option_supplied(raw_args, "--log"))
                  return
          '''
          if text.count(old) != 1:
              raise SystemExit('one-shot dispatch target was not unique')
          text = text.replace(old, new)

          source.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          old = '''## [Unreleased]

          ## [1.5.0] - 2026-07-16
          '''
          new = '''## [Unreleased]

          ### Fixed
          - Made legacy `--once --log FILE` write one complete CSV sample and collect requested `powermetrics` synchronously before the reading.

          ## [1.5.0] - 2026-07-16
          '''
          if text.count(old) != 1:
              raise SystemExit('changelog insertion target was not unique')
          changelog.write_text(text.replace(old, new))
          PY

          cat > legacy/tests/test_once_logging.py <<'PY'
          #!/usr/bin/env python3
          """Regression tests for the active legacy monitor's one-shot lifecycle."""

          from __future__ import annotations

          import csv
          import io
          import sys
          import tempfile
          import unittest
          from contextlib import redirect_stdout
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import Mock, patch

          ROOT = Path(__file__).resolve().parents[1]
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))

          import mac_power_watch as monitor  # noqa: E402


          def sample_row():
              return {
                  "timestamp": "2026-07-26T00:00:00+00:00",
                  "version": monitor.VERSION,
                  "display_time": "2026-07-26 00:00:00",
                  "phase": "test",
                  "mode": "discharging",
                  "power_source": "Battery Power",
                  "battery_percent": 50.0,
                  "battery_temp_c": 30.0,
                  "battery_temp_f": 86.0,
                  "virtual_temp_c": 30.0,
                  "net_battery_watts": -12.0,
                  "bms_system_power_w": 12.0,
                  "preferred_system_power_w": 12.0,
                  "charger_live_verdict": "battery power",
                  "whole_mac_watts_estimate": 12.0,
                  "whole_mac_watts_note": "test",
                  "battery_voltage_v": 12.0,
                  "battery_amperage_a": -1.0,
                  "adapter_reported_watts": 0.0,
                  "battery_health_percent": 95.0,
                  "pm_status": "off",
              }


          def once_args(**overrides):
              values = {
                  "phase_file": "/tmp/phase",
                  "powermetrics": False,
                  "powermetrics_sample_ms": 1000,
                  "log": "auto",
                  "no_log": False,
                  "debug_every": 30,
                  "no_debug_json": True,
              }
              values.update(overrides)
              return SimpleNamespace(**values)


          class OnceLoggingTests(unittest.TestCase):
              def test_bare_once_keeps_stdout_only_behavior(self):
                  with (
                      patch.object(monitor, "collect_reading", return_value=(sample_row(), {})),
                      patch.object(monitor, "RunLogger") as logger,
                      redirect_stdout(io.StringIO()) as output,
                  ):
                      result = monitor.run_once(once_args(), log_requested=False)

                  self.assertEqual(result["battery_percent"], 50.0)
                  self.assertIn("MacBook Power Monitor", output.getvalue())
                  logger.assert_not_called()

              def test_explicit_log_writes_one_header_and_one_data_row(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "one-shot.csv"
                      with (
                          patch.object(monitor, "collect_reading", return_value=(sample_row(), {"raw": True})),
                          redirect_stdout(io.StringIO()),
                      ):
                          monitor.run_once(once_args(log=str(path)), log_requested=True)

                      with path.open(newline="", encoding="utf-8") as handle:
                          rows = list(csv.reader(handle))

                  self.assertEqual(len(rows), 2)
                  self.assertEqual(rows[0], monitor.CSV_HEADERS)
                  self.assertEqual(rows[1][monitor.CSV_HEADERS.index("battery_percent")], "50.0")

              def test_requested_powermetrics_snapshot_is_used_for_reading(self):
                  snapshot = {"pm_status": "ok", "soc_power_w": 9.5}
                  collector = Mock(return_value=(sample_row(), {}))
                  with (
                      patch.object(monitor, "collect_powermetrics_once", return_value=snapshot) as powermetrics,
                      patch.object(monitor, "collect_reading", collector),
                      redirect_stdout(io.StringIO()),
                  ):
                      monitor.run_once(once_args(powermetrics=True, powermetrics_sample_ms=750))

                  powermetrics.assert_called_once_with(750)
                  collector.assert_called_once_with("/tmp/phase", snapshot)

              def test_powermetrics_collection_runs_once_synchronously(self):
                  worker = Mock()
                  worker.snapshot.return_value = {"pm_status": "ok"}
                  with patch.object(monitor, "PowermetricsWorker", return_value=worker) as worker_type:
                      result = monitor.collect_powermetrics_once(625)

                  worker_type.assert_called_once_with(sample_ms=625)
                  worker._run_once.assert_called_once_with()
                  worker.snapshot.assert_called_once_with()
                  self.assertEqual(result, {"pm_status": "ok"})

              def test_main_distinguishes_default_and_explicit_log(self):
                  with patch.object(monitor, "run_once") as run:
                      monitor.main(["--once"])
                      self.assertFalse(run.call_args.kwargs["log_requested"])

                      monitor.main(["--once", "--log=/tmp/one-shot.csv"])
                      self.assertTrue(run.call_args.kwargs["log_requested"])

              def test_option_supplied_accepts_separate_and_equals_forms(self):
                  self.assertFalse(monitor.option_supplied(["--once"], "--log"))
                  self.assertTrue(monitor.option_supplied(["--once", "--log", "out.csv"], "--log"))
                  self.assertTrue(monitor.option_supplied(["--once", "--log=out.csv"], "--log"))


          if __name__ == "__main__":
              unittest.main()
          PY

          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          manifest = Path('legacy/MANIFEST_SHA256.txt')
          entries = {}
          for line in manifest.read_text().splitlines():
              digest, path = line.split('  ', 1)
              entries[path] = digest

          for relative in ('mac_power_watch.py', 'tests/test_once_logging.py'):
              data = (Path('legacy') / relative).read_bytes()
              entries[relative] = hashlib.sha256(data).hexdigest()

          manifest.write_text(''.join(f'{entries[path]}  {path}\n' for path in sorted(entries)))
          PY

          git diff --check
          git diff --exit-code origin/main -- legacy/mac_power_watch_v0.12.0.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q legacy
          python3 -m unittest discover -s legacy/tests -v
          (cd legacy && sha256sum -c MANIFEST_SHA256.txt)
          test -z "$(gofmt -l cmd internal)"
          go test -count=1 ./...
          go vet ./...
      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-legacy-once.yml
          git add CHANGELOG.md legacy/mac_power_watch.py legacy/MANIFEST_SHA256.txt legacy/tests/test_once_logging.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete legacy one-shot logging'
          git push origin HEAD:fix/legacy-once-logging
